<svg xmlns="http://www.w3.org/2000/svg" width="820" height="820" fill="none" viewBox="0 0 820 820">
  <!-- Lunar cycle: one clean orbital ring with three graduated moon phases.
       Redrawn to read at chip size (22px) — the old three-crescent + dust-mote
       composition turned to mud when small. Family palette #EEDD91 / #DCCC7B /
       #9A8F40, fill-only, no human forms. -->
  <!-- Orbital ring -->
  <circle cx="410" cy="410" r="250" stroke="#EEDD91" stroke-width="40" fill="none"/>
  <!-- Full moon at the top of the orbit -->
  <circle cx="410" cy="160" r="96" fill="#EEDD91"/>
  <!-- Soft lit side on the full moon (volume, matches family) -->
  <circle cx="372" cy="138" r="44" fill="#DCCC7B" fill-opacity="0.55"/>
  <!-- Waning phase, lower-left of the orbit -->
  <circle cx="234" cy="586" r="44" fill="#DCCC7B"/>
  <!-- New phase, lower-right of the orbit -->
  <circle cx="586" cy="586" r="28" fill="#9A8F40"/>
</svg>
