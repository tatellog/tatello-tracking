<svg viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- PERFIL IZQUIERDO · el meridiano se CURVA hacia la izquierda (el giro),
       la estrella llena se adelanta al borde izquierdo (hacia dónde miras)
       y deja una estela de dos puntos menguantes a la derecha (de dónde
       vienes). Estrella = fourPointStarPath(14.5, 24, 4.6). Los puntos en
       los extremos del arco son ticks de cartografía, como en north-star. -->
  <path d="M28.5 8 Q16 24 28.5 40" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" opacity="0.55" />
  <circle cx="28.5" cy="8" r="0.9" fill="currentColor" opacity="0.6" />
  <circle cx="28.5" cy="40" r="0.9" fill="currentColor" opacity="0.6" />
  <path d="M14.5 19.4 L15.54 22.96 L19.1 24 L15.54 25.04 L14.5 28.6 L13.46 25.04 L9.9 24 L13.46 22.96 Z" fill="currentColor" />
