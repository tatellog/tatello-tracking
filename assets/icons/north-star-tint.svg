<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="none" viewBox="0 0 24 24">
  <!-- Estrella del norte line-art TINTABLE (stroke currentColor) — hermana
       de la familia -tint (water-tint, moon-tint...). Nace porque
       north-star.svg es una placa con gradientes de oro horneados (no
       tintable) y rompía la familia de glifos de "Tu camino" en Ajustes. -->
  <!-- Cuerpo: estrella de 4 puntas con cintura curva (la firma Stelar ✦). -->
  <path
    stroke="currentColor"
    stroke-width="1.6"
    stroke-linejoin="round"
    stroke-linecap="round"
    d="M12 2.8C12.7 7.2 13.9 9.6 16 10.9 18.1 12.2 19.6 12 21.2 12 19.6 12 18.1 11.8 16 13.1 13.9 14.4 12.7 16.8 12 21.2 11.3 16.8 10.1 14.4 8 13.1 5.9 11.8 4.4 12 2.8 12 4.4 12 5.9 12.2 8 10.9 10.1 9.6 11.3 7.2 12 2.8Z"
  />
  <!-- Chispa compañera, asimétrica (regla de asimetría del art brief). -->
  <path
    stroke="currentColor"
    stroke-width="1.3"
    stroke-linecap="round"
    opacity="0.55"
    d="M18.6 4.6v2.2M17.5 5.7h2.2"
  />
</svg>
