<?xml version="1.0" encoding="UTF-8"?>
<!--
  ════════════════════════════════════════════════════════════════════
  Leo · constelación encendida — OVERLAY sobre el emblema
  ════════════════════════════════════════════════════════════════════

  La pieza que faltaba: el asterismo de Leo dibujado RICO y BRILLANTE
  (estrellas de 4 puntas con halo radial + líneas glowing) para
  superponerse EXACTO sobre `leo-emblem.svg`, alineado a la ANATOMÍA del
  león de Stelar — no a coords abstractas.

  ── CLAVE DE INTEGRACIÓN ───────────────────────────────────────────
  Este SVG comparte viewBox 0 0 1024 1024 con leo-emblem.svg. Si
  renderizas el emblema y este overlay al MISMO width/height, encima uno
  del otro (position: absolute), las estrellas caen sobre la anatomía:
    · Regulus      → pecho / arranque de la pata delantera
    · Eta · Algieba · Adhafera · Rasalas · Epsilon → la HOZ (sickle) =
      el perfil de la cabeza + la melena que cae
    · Chort · Zosma · Denebola → el TRIÁNGULO = lomo + cuartos traseros
      + el arranque de la cola
  (mismas 9 estrellas y 10 líneas que features/tabs/zodiac/figures.ts,
  re-proyectadas a la silueta del emblema.)

  ── LENGUAJE DE LUZ ────────────────────────────────────────────────
  Magenta = encendido / vivo (oro queda para el león). Copia el sistema
  de lit-lines: 3 sub-capas (bloom ancho → cuerpo → spine cream fino) y
  estrellas de 4 puntas con halo (capas concéntricas, SIN <filter> /
  <feGaussianBlur> — el blur se finge por capas, evita el bug de
  react-native-svg en alpha-stops de gradientes).

  ── ESTADO ─────────────────────────────────────────────────────────
  Dibuja "TODO ENCENDIDO". Para el estado vivo (estrellas apagadas en
  brasa), ver nota a frontend-specialist en el mensaje de entrega.

  Tintable: las líneas usan currentColor (pásale magenta). Las estrellas
  llevan magenta+cream inline para que el núcleo no se pierda al tintar.
-->
<svg viewBox="0 0 1024 1024" fill="none" xmlns="http://www.w3.org/2000/svg">

  <!-- ════ Coords resueltas sobre la anatomía del emblema (1024²) ════
       0 Regulus  (372, 612)   pecho / pata delantera
       1 Eta      (452, 360)   garganta / base de la mandíbula
       2 Algieba  (470, 250)   morro / frente
       3 Adhafera (430, 165)   ceja / corona de la melena
       4 Rasalas  (352, 150)   nuca / lo alto de la melena
       5 Epsilon  (300, 232)   melena que cae por detrás de la cabeza
       6 Chort    (560, 470)   lomo medio
       7 Zosma    (742, 458)   ancas / lo alto de los cuartos traseros
       8 Denebola (770, 648)   arranque de la cola / grupa
       Líneas (= figures.ts):
         hoz/sickle  0-1-2-3-4-5
         triángulo   6-7-8-6
         puentes     0-6 · 2-7
  ════════════════════════════════════════════════════════════════ -->

  <!-- ── Capa 0 · wash ambiental ──────────────────────────────────
       Halo magenta a muy baja alfa centrado en el corazón del león
       (Regulus) y en la melena — finge un radial sin <RadialGradient>.
       Da el "glow" general de la referencia. -->
  <g>
    <ellipse cx="430" cy="380" rx="430" ry="430" fill="#E91E63" opacity="0.020" />
    <ellipse cx="430" cy="380" rx="330" ry="330" fill="#E91E63" opacity="0.022" />
    <ellipse cx="430" cy="380" rx="240" ry="240" fill="#FF4886" opacity="0.026" />
    <ellipse cx="430" cy="380" rx="150" ry="150" fill="#FF4886" opacity="0.030" />
  </g>

  <!-- ── Capa 1 · líneas (filamentos magenta, 3 sub-capas) ────────
       currentColor para tinte; el spine cream es lo que las vuelve
       "luz" y no "tinta". -->
  <g stroke-linecap="round" stroke-linejoin="round">
    <!-- bloom ancho (magenta, muy suave) -->
    <g stroke="currentColor" stroke-opacity="0.16" stroke-width="22">
      <path d="M372 612 L452 360 L470 250 L430 165 L352 150 L300 232" />
      <path d="M560 470 L742 458 L770 648 L560 470" />
      <path d="M372 612 L560 470" />
      <path d="M470 250 L742 458" />
    </g>
    <!-- cuerpo (magenta hot) -->
    <g stroke="#FF4886" stroke-opacity="0.55" stroke-width="6">
      <path d="M372 612 L452 360 L470 250 L430 165 L352 150 L300 232" />
      <path d="M560 470 L742 458 L770 648 L560 470" />
      <path d="M372 612 L560 470" />
      <path d="M470 250 L742 458" />
    </g>
    <!-- spine cream (hilo fino → "luz") -->
    <g stroke="#FFF0F5" stroke-opacity="0.75" stroke-width="1.6">
      <path d="M372 612 L452 360 L470 250 L430 165 L352 150 L300 232" />
      <path d="M560 470 L742 458 L770 648 L560 470" />
      <path d="M372 612 L560 470" />
      <path d="M470 250 L742 458" />
    </g>
  </g>

  <!-- ── Capa 2 · estrellas de 4 puntas con halo radial ──────────
       Cada estrella: halo radial (2 elipses) + destello de 4 puntas
       (path losange vertical + horizontal) + anillo magenta + núcleo
       cream. El tamaño escala con la "magnitud": Regulus y Denebola son
       los anchors (los corazones de la figura).
       Un símbolo reutilizable habría sido <use>, pero RN no resuelve
       symbol/use externos de forma fiable → se dibujan inline. -->

  <!-- Regulus · ANCHOR (el corazón del león, en el pecho) -->
  <g>
    <ellipse cx="372" cy="612" rx="60" ry="60" fill="#FF4886" opacity="0.10" />
    <ellipse cx="372" cy="612" rx="34" ry="34" fill="#FF4886" opacity="0.16" />
    <!-- destello 4 puntas -->
    <path d="M372 568 Q377 607 372 656 Q367 607 372 568 Z" fill="#FFF0F5" opacity="0.9" />
    <path d="M328 612 Q367 607 416 612 Q367 617 328 612 Z" fill="#FFF0F5" opacity="0.9" />
    <circle cx="372" cy="612" r="11" fill="#FF4886" opacity="0.55" />
    <circle cx="372" cy="612" r="6.5" fill="#FFF0F5" />
  </g>

  <!-- Denebola · ANCHOR (el último resplandor, en la cola) -->
  <g>
    <ellipse cx="770" cy="648" rx="54" ry="54" fill="#FF4886" opacity="0.10" />
    <ellipse cx="770" cy="648" rx="30" ry="30" fill="#FF4886" opacity="0.16" />
    <path d="M770 608 Q775 644 770 688 Q765 644 770 608 Z" fill="#FFF0F5" opacity="0.9" />
    <path d="M730 648 Q766 643 810 648 Q766 653 730 648 Z" fill="#FFF0F5" opacity="0.9" />
    <circle cx="770" cy="648" r="10" fill="#FF4886" opacity="0.55" />
    <circle cx="770" cy="648" r="6" fill="#FFF0F5" />
  </g>

  <!-- Algieba · secundaria (la curva de su melena / morro) -->
  <g>
    <ellipse cx="470" cy="250" rx="40" ry="40" fill="#FF4886" opacity="0.10" />
    <path d="M470 218 Q474 247 470 282 Q466 247 470 218 Z" fill="#FFF0F5" opacity="0.85" />
    <path d="M438 250 Q467 246 502 250 Q467 254 438 250 Z" fill="#FFF0F5" opacity="0.85" />
    <circle cx="470" cy="250" r="8.5" fill="#FF4886" opacity="0.5" />
    <circle cx="470" cy="250" r="5" fill="#FFF0F5" />
  </g>

  <!-- Zosma · secundaria (la fuerza de su andar / ancas) -->
  <g>
    <ellipse cx="742" cy="458" rx="40" ry="40" fill="#FF4886" opacity="0.10" />
    <path d="M742 426 Q746 455 742 490 Q738 455 742 426 Z" fill="#FFF0F5" opacity="0.85" />
    <path d="M710 458 Q739 454 774 458 Q739 462 710 458 Z" fill="#FFF0F5" opacity="0.85" />
    <circle cx="742" cy="458" r="8.5" fill="#FF4886" opacity="0.5" />
    <circle cx="742" cy="458" r="5" fill="#FFF0F5" />
  </g>

  <!-- Chort · media (el inicio de su rugido / lomo) -->
  <g>
    <ellipse cx="560" cy="470" rx="34" ry="34" fill="#FF4886" opacity="0.09" />
    <path d="M560 442 Q563 467 560 498 Q557 467 560 442 Z" fill="#FFF0F5" opacity="0.8" />
    <path d="M532 470 Q557 467 588 470 Q557 473 532 470 Z" fill="#FFF0F5" opacity="0.8" />
    <circle cx="560" cy="470" r="7" fill="#FF4886" opacity="0.45" />
    <circle cx="560" cy="470" r="4.2" fill="#FFF0F5" />
  </g>

  <!-- Epsilon · media (su mirada / melena trasera) -->
  <g>
    <ellipse cx="300" cy="232" rx="34" ry="34" fill="#FF4886" opacity="0.09" />
    <path d="M300 204 Q303 229 300 260 Q297 229 300 204 Z" fill="#FFF0F5" opacity="0.8" />
    <path d="M272 232 Q297 229 328 232 Q297 235 272 232 Z" fill="#FFF0F5" opacity="0.8" />
    <circle cx="300" cy="232" r="7" fill="#FF4886" opacity="0.45" />
    <circle cx="300" cy="232" r="4" fill="#FFF0F5" />
  </g>

  <!-- Eta · tenue (su cuello / garganta) -->
  <g>
    <ellipse cx="452" cy="360" rx="28" ry="28" fill="#FF4886" opacity="0.08" />
    <path d="M452 338 Q455 358 452 384 Q449 358 452 338 Z" fill="#FFF0F5" opacity="0.75" />
    <path d="M430 360 Q450 357 476 360 Q450 363 430 360 Z" fill="#FFF0F5" opacity="0.75" />
    <circle cx="452" cy="360" r="5.5" fill="#FF4886" opacity="0.4" />
    <circle cx="452" cy="360" r="3.3" fill="#FFF0F5" />
  </g>

  <!-- Adhafera · tenue (la trenza de su melena / ceja) -->
  <g>
    <ellipse cx="430" cy="165" rx="28" ry="28" fill="#FF4886" opacity="0.08" />
    <path d="M430 143 Q433 163 430 189 Q427 163 430 143 Z" fill="#FFF0F5" opacity="0.75" />
    <path d="M408 165 Q428 162 454 165 Q428 168 408 165 Z" fill="#FFF0F5" opacity="0.75" />
    <circle cx="430" cy="165" r="5.5" fill="#FF4886" opacity="0.4" />
    <circle cx="430" cy="165" r="3.3" fill="#FFF0F5" />
  </g>

  <!-- Rasalas · la más tenue (la corona de su cabeza / lo alto de la melena) -->
  <g>
    <ellipse cx="352" cy="150" rx="26" ry="26" fill="#FF4886" opacity="0.07" />
    <path d="M352 130 Q355 148 352 172 Q349 148 352 130 Z" fill="#FFF0F5" opacity="0.7" />
    <path d="M332 150 Q350 147 374 150 Q350 153 332 150 Z" fill="#FFF0F5" opacity="0.7" />
    <circle cx="352" cy="150" r="5" fill="#FF4886" opacity="0.38" />
    <circle cx="352" cy="150" r="3" fill="#FFF0F5" />
  </g>
</svg>
