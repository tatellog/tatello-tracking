<?xml version="1.0" encoding="UTF-8"?>
<!--
  Divisor ornamental "astral" — un hairline de oro con un nodo-estrella
  central de 4 puntas y dos puntos satélite que se desvanecen. Reemplaza
  el borde recto / la ausencia de separación entre secciones del modal
  "Tu Leo". Tintable con currentColor; por defecto hereda el oro del
  sistema. Pensado para ~280px de ancho, alto fijo 16.

  Uso en RN:
    import LeoDivider from '@/assets/zodiac-art/leo-map-divider.svg'
    <LeoDivider width={240} height={14} color={colors.oro} />
-->
<svg viewBox="0 0 280 16" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Hairline izquierda: nace en cero opacidad y crece hacia el centro -->
  <path d="M8 8 H120" stroke="currentColor" stroke-width="0.75"
        stroke-linecap="round" opacity="0.32" />
  <path d="M8 8 H120" stroke="currentColor" stroke-width="0.75"
        stroke-linecap="round" opacity="0.18"
        stroke-dasharray="0.5 4" />
  <!-- Hairline derecha (espejo) -->
  <path d="M160 8 H272" stroke="currentColor" stroke-width="0.75"
        stroke-linecap="round" opacity="0.32" />
  <path d="M160 8 H272" stroke="currentColor" stroke-width="0.75"
        stroke-linecap="round" opacity="0.18"
        stroke-dasharray="0.5 4" />
  <!-- Puntos satélite -->
  <circle cx="124" cy="8" r="0.9" fill="currentColor" opacity="0.5" />
  <circle cx="156" cy="8" r="0.9" fill="currentColor" opacity="0.5" />
  <!-- Nodo central: estrella de 4 puntas + halo suave -->
  <circle cx="140" cy="8" r="4" fill="currentColor" opacity="0.10" />
  <path d="M140 1.5 L141 7 L146.5 8 L141 9 L140 14.5 L139 9 L133.5 8 L139 7 Z"
        fill="currentColor" opacity="0.85" />
</svg>
